name: Publish Wi-Fi Share release

on:
  push:
    branches: [main]
    paths:
      - "src/index.template.html"
      - "app.config.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wifi-share-versioned-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1
      - name: Build and test standalone artifacts
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Prepare versioned release files
        id: prepare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content -Raw -Encoding UTF8 app.config.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid SemVer: $version" }
          $tag="v$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "GitHub Release $tag already exists. No published release will be overwritten."
            "exists=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "exists=false" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/index.html "release/htmlapps-wifi-share-$tag.html"
          Copy-Item dist/index.self-extract.html "release/htmlapps-wifi-share-$tag.self-extract.html"
          Compress-Archive -Path "release/*.html" -DestinationPath "release/htmlapps-wifi-share-$tag.zip" -Force
      - name: Publish tagged GitHub Release after successful tests
        if: steps.prepare.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="${{ steps.prepare.outputs.tag }}"
          gh release create $tag "release/htmlapps-wifi-share-$tag.html" "release/htmlapps-wifi-share-$tag.self-extract.html" "release/htmlapps-wifi-share-$tag.zip" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Wi-Fi Share $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed." }
